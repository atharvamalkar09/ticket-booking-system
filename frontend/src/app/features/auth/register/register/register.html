<app-navbar></app-navbar>

<div class="auth-page">
  <div class="register-container card">

    <div class="register-container__header">
      <h2>Create account</h2>
      <p class="text-secondary">A few details and you're in.</p>
    </div>

    <form (ngSubmit)="onRegister()" novalidate>

      <div class="field">
        <label class="field__label" for="username">
          Username
        </label>

        <input
          class="input"
          type="text"
          id="username"
          [(ngModel)]="userData.username"
          name="username"
          placeholder="Enter your Username"
          required
        />
      </div>


      <div class="field">
        <label class="field__label" for="email">
          Email
        </label>

        <input
          class="input"
          type="email"
          id="email"
          [(ngModel)]="userData.email"
          name="email"
          placeholder="Enter your Email"
          required
        />
      </div>


      <div class="form-row">

        <div class="field">
          <label class="field__label" for="phone">
            Phone number
          </label>

          <input
            class="input"
            type="tel"
            id="phone"
            [(ngModel)]="userData.phone_no"
            name="phone_no"
            placeholder="+91 98765 43210"
            required
          />
        </div>


        <div class="field">
          <label class="field__label" for="city">
            City
          </label>

          <input
            class="input"
            type="text"
            id="city"
            [(ngModel)]="userData.city"
            name="city"
            placeholder="Mumbai"
            required
          />
        </div>

      </div>


      <div class="field">
        <label class="field__label" for="address">
          Address
          <span class="text-secondary">(optional)</span>
        </label>

        <input
          class="input"
          type="text"
          id="address"
          [(ngModel)]="userData.address"
          name="address"
          placeholder="Street, area"
        />
      </div>


      <div class="field">
        <label class="field__label" for="password">
          Password
        </label>

        <input
          class="input"
          type="password"
          id="password"
          [(ngModel)]="userData.password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>


      <button
        class="btn btn--primary btn--full btn--lg"
        type="submit"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Registering…' : 'Register' }}
      </button>

    </form>


    <p class="register-container__footer text-secondary">
      Already have an account?
      <a href="/login">Sign in</a>
    </p>

  </div>
</div>


@if (showRegisterDialog) {

  <div
    class="register-dialog-backdrop"
    (click)="closeRegisterDialogOnBackdrop($event)"
  >

    <div
      class="register-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="register-dialog-title"
    >

      <div class="register-dialog__icon">
        !
      </div>


      <div class="register-dialog__content">

        <h2
          id="register-dialog-title"
          class="register-dialog__title"
        >
          Registration failed
        </h2>

        <p class="register-dialog__message">
          {{ errorMessage }}
        </p>

      </div>


      <div class="register-dialog__actions">

        <button
          type="button"
          class="register-dialog__button register-dialog__button--confirm"
          (click)="closeRegisterDialog()"
        >
          OK
        </button>

      </div>

    </div>

  </div>

}
